      - hadolint/*
      - gittools/*
      - fsfe/*
      - cachix/*
      - nix-community/*
      - DeterminateSystems/*
      - 1Password/*
      - tailscale/*
      - octokit/*
      - NuGet/*
      - depot/*
      - chromaui/*
      - signpath/*
      - rust-lang/*
      - apache/*
      - Homebrew/*
      - PyO3/*
      - EmbarkStudios/*
      - bytecodealliance/*
