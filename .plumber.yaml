# Plumber configuration (https://github.com/getplumber/plumber)
# Generated by: plumber config init

version: "2.0"
github:
  controls:
    containerImageMustNotUseForbiddenTags:
      enabled: true
      tags:
      - latest
      - dev
      - development
      - staging
      - main
      - master
      containerImagesMustBePinnedByDigest: true
    branchMustBeProtected:
      enabled: true
      namePatterns:
      - main
      - master
      - release/*
      - production
      - dev
      defaultMustBeProtected: true
      allowForcePush: false
      codeOwnerApprovalRequired: false
    externalRefsMustNotCollide:
      enabled: true
    pipelineMustNotEnableDebugTrace:
      enabled: true
      forbiddenVariables:
      - ACTIONS_STEP_DEBUG
      - ACTIONS_RUNNER_DEBUG
    securityJobsMustNotBeWeakened:
      enabled: true
      securityJobPatterns:
      - '*codeql*'
      - '*dependency-review*'
      - '*trufflehog*'
      - '*gitleaks*'
      - '*osv-scanner*'
      - '*semgrep*'
      - '*trivy*'
      - '*snyk*'
      - '*-sast'
      - '*-sast-*'
      - '*-scan'
      - '*scan*'
      - '*-security'
      - '*-security-*'
      - '*-audit'
      - '*-audit-*'
      - '*secret*detect*'
      - '*detect*secret*'
      allowFailureMustBeFalse:
        enabled: true
      rulesMustNotBeRedefined:
        enabled: true
      whenMustNotBeManual:
        enabled: true
    pipelineMustNotUseDockerInDocker:
      enabled: true
      detectInsecureDaemon: true
    actionsMustBePinnedByCommitSha:
      enabled: true
      trustedOwners:
      - actions
      - github
    githubActionMustComeFromAuthorizedSources:
      enabled: true
      trustGithubOfficialActions: true
      trustSameOrgActions: true
      minimumStars: 20000
      trustedGithubActions:
      - aws-actions/*
      - google-github-actions/*
      - googleapis/*
      - Azure/*
      - cloudflare/*
      - hashicorp/*
      - pulumi/*
      - digitalocean/*
      - ibm/*
      - oracle-actions/*
      - canonical/*
      - fastly/*
      - docker/*
      - gradle/*
      - goreleaser/*
      - bazel-contrib/*
      - jfrog/*
      - dagger/*
      - buildkite/*
      - CircleCI-Public/*
      - earthly/*
      - pypa/*
      - ruby/*
      - denoland/*
      - oven-sh/*
      - astral-sh/*
      - golangci/*
      - dart-lang/*
      - erlef/*
      - haskell-actions/*
      - julia-actions/*
      - ocaml/*
      - conda-incubator/*
      - r-lib/*
      - sbt/*
      - VirtusLab/*
      - gleam-lang/*
      - getplumber/*
      - step-security/*
      - ossf/*
      - sigstore/*
      - slsa-framework/*
      - aquasecurity/*
      - anchore/*
      - snyk/*
      - SonarSource/*
      - trufflesecurity/*
      - gitleaks/*
      - chainguard-dev/*
      - GitGuardian/*
      - bridgecrewio/*
      - zaproxy/*
      - Checkmarx/*
      - veracode/*
      - tenable/*
      - semgrep/*
      - in-toto/*
      - sonatype/*
      - sonatype-nexus-community/*
      - checkmarx-ts/*
      - Qualys/*
      - orcasecurity/*
      - oxsecurity/*
      - codecov/*
      - getsentry/*
      - DataDog/*
      - cypress-io/*
      - JetBrains/*
      - microsoft/*
      - atlassian/*
      - Shopify/*
      - netlify/*
      - planetscale/*
      - supabase/*
      - expo/*
      - grafana/*
      - honeycombio/*
      - newrelic/*
      - saucelabs/*
      - mongodb/*
      - adobe/*
      - facebook/*
      - helm/*
      - kubernetes-sigs/*
      - opentofu/*
      - ansible/*
      - ansible-community/*
      - pnpm/*
      - anthropics/*
