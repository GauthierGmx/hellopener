name: CI
on:
  push:
    branches:
      - main
      - feature/*
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint (${{matrix.project}})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 2
    strategy:
      matrix:
        project: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Launching "setup" local action
        uses: ./.github/actions/setup-node/
        with:
          node-version: ${{ env.NODE_VERSION }}
          working-directory: ${{ matrix.project }}

      - name: Run lint
        working-directory: ${{ matrix.project }}
        run: npm run lint
  
  test:
    name: Testing ${{matrix.project}}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      matrix:
        project: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Launching "setup" local action
        uses: ./.github/actions/setup-node/
        with:
          node-version: ${{ env.NODE_VERSION }}
          working-directory: ${{ matrix.project }}
      
      - name: Executing unit tests
        working-directory: ${{ matrix.project }}
        run: npm run test

      - name: Uploading test coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: coverage-${{ matrix.project }}
          path: ${{ matrix.project }}/coverage/

  build:
    needs: [lint, test]
    if: "!contains(github.event.head_commit.message, '[skip ci - doc]')"
    name: Build ${{matrix.project}}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      matrix:
        project: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Launching "setup" local action
        uses: ./.github/actions/setup-node/
        with:
          node-version: ${{ env.NODE_VERSION }}
          working-directory: ${{ matrix.project }}

      - name: Building the application
        working-directory: ${{ matrix.project }}
        run: npm run build
  
  ghcr:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci - doc]')
    name: Build & push ${{matrix.project}}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - project: backend
            image: backend
            build_args: ''
          - project: frontend
            image: frontend
            build_args: |
              VITE_API_URL=/api
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build & Push ${{matrix.project}}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{matrix.project}}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{github.repository_owner}}/${{matrix.image}}:sha-${{ github.sha }}
            ghcr.io/${{github.repository_owner}}/${{matrix.image}}:main

      - name: Generate attestation for ${{matrix.project}}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{github.repository_owner}}/${{matrix.image}}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      
      - name: Generate SBOM for ${{matrix.project}}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{github.repository_owner}}/${{matrix.image}}:sha-${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{matrix.image}}.spdx.json

      - name: Generate attestation for SBOM of ${{matrix.project}}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{github.repository_owner}}/${{matrix.image}}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{matrix.image}}.spdx.json
          push-to-registry: true